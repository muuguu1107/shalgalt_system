<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Шалгалтын систем</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="home-page">

    <div class="container">

        <div class="text-center mb-5">

            <div class="logo">
                ✓
            </div>

            <h1>
                ШАЛГАЛТЫН СИСТЕМ
            </h1>

            <p>
                Шалгалтын төрлөө сонгоно уу
            </p>

        </div>


        <form
        method="POST"
        action="/select_exam">


            <div class="row g-4 justify-content-center">


                <!-- ААД -->

                <div class="col-md-5">

                    <button
                    type="submit"
                    name="exam_type"
                    value="ААД"
                    class="exam-card">

                        <div class="exam-icon">
                            ⚡
                        </div>

                        <h2>
                            ААД
                        </h2>

                        <p>
                            Аюулгүй ажиллагааны
                            дүрмийн шалгалт
                        </p>

                        <span class="btn btn-primary">
                            Шалгалт өгөх
                        </span>

                    </button>

                </div>


                <!-- НАРЯД -->

                <div class="col-md-5">

                    <button
                    type="submit"
                    name="exam_type"
                    value="Нарядын систем"
                    class="exam-card">

                        <div class="exam-icon green">
                            📋
                        </div>

                        <h2>
                            Нарядын систем
                        </h2>

                        <p>
                            Нарядын системийн
                            мэдлэгийн шалгалт
                        </p>

                        <span class="btn btn-success">
                            Шалгалт өгөх
                        </span>

                    </button>

                </div>


            </div>

        </form>

    </div>

</div>


</body>

</html>
