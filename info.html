<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Шалгалт эхлүүлэх</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="center-page">

<div class="info-card">

<div class="text-center">

<div class="big-icon">
📝
</div>

<h2>
{{ exam_type }}
</h2>

<p class="text-muted">
Шалгалтын мэдээлэл
</p>

</div>


<!-- ШАЛГАЛТЫН МЭДЭЭЛЭЛ -->

<div class="row g-3 my-4">

<div class="col-6">

<div class="stat">

<strong>
10
</strong>

<span>
Асуулт
</span>

</div>

</div>


<div class="col-6">

<div class="stat">

<strong>
10 мин
</strong>

<span>
Хугацаа
</span>

</div>

</div>

</div>


<!-- АНХААРУУЛГА -->

<div class="alert alert-primary">

<strong>
Анхааруулга
</strong>

<br>

Шалгалт эхэлснээс хойш
<strong>
10 минут
</strong>
хугацаатай.

Хугацаа дуусмагц
шалгалт автоматаар дуусна.

</div>


<!-- ОВГИЙН НЭР -->

<form
method="POST"
action="/start">


<div class="mb-3">

<label class="form-label">
Овог нэр
</label>

<input
type="text"
name="name"
class="form-control form-control-lg"
placeholder="Овог нэрээ оруулна уу"
required>

</div>


<!-- АЛБАН ТУШААЛ -->

<div class="mb-4">

<label class="form-label">
Албан тушаал
</label>

<input
type="text"
name="position"
class="form-control form-control-lg"
placeholder="Албан тушаалаа оруулна уу"
required>

</div>


<!-- ЭХЛҮҮЛЭХ -->

<button
type="submit"
class="btn btn-primary btn-lg w-100">

ШАЛГАЛТ ЭХЛҮҮЛЭХ

</button>

</form>

</div>

</div>

</body>

</html>
