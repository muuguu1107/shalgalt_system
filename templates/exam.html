<!DOCTYPE html>
<html lang="mn">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Шалгалт</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="timer" id="timer">
    10:00
</div>

<div class="exam-container">

    <div class="exam-header">

        <h1>{{ exam_type }}</h1>

        <div class="candidate">
            {{ surname }} — {{ position }}
        </div>

    </div>

    <form
        id="examForm"
        action="{{ url_for('submit') }}"
        method="POST"
    >

        {% for q in questions %}

        <div class="question-card">

            <div class="question-number">
                Асуулт {{ loop.index }}
            </div>

            <div class="question-text">
                {{ q.question }}
            </div>

            <div class="options">

                {% for letter, text in q.options.items() %}

                <label class="option">

                    <input
                        type="radio"
                        name="question_{{ loop.parent.index0 }}"
                        value="{{ letter }}"
                    >

                    <span class="option-letter">
                        {{ letter }}
                    </span>

                    <span>
                        {{ text }}
                    </span>

                </label>

                {% endfor %}

            </div>

        </div>

        {% endfor %}

        <button
            type="submit"
            class="submit-button"
        >
            ШАЛГАЛТ ДУУСГАХ
        </button>

    </form>

</div>


<script>

let totalSeconds = 10 * 60;

const timer = document.getElementById("timer");
const form = document.getElementById("examForm");

function updateTimer() {

    let minutes = Math.floor(
        totalSeconds / 60
    );

    let seconds = totalSeconds % 60;

    minutes = String(minutes).padStart(
        2,
        "0"
    );

    seconds = String(seconds).padStart(
        2,
        "0"
    );

    timer.textContent =
        minutes + ":" + seconds;

    if (totalSeconds <= 0) {

        form.submit();

        return;
    }

    totalSeconds--;

    setTimeout(
        updateTimer,
        1000
    );
}

updateTimer();

</script>

</body>
</html>
