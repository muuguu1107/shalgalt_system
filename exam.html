<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>{{ exam_type }} - Шалгалт</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- ======================================
     FIXED TIMER
======================================= -->

<div
id="timerBox"
class="fixed-timer">

<div class="timer-title">
ҮЛДСЭН ХУГАЦАА
</div>

<div
id="timer"
class="timer">
10:00
</div>

</div>



<div class="exam-container">


<!-- HEADER -->

<div class="exam-header">

<div>

<span class="badge bg-primary">
{{ exam_type }}
</span>

<h3 class="mt-2">
Шалгалт
</h3>

<p class="text-muted mb-0">

{{ name }}
<br>

{{ position }}

</p>

</div>


<div class="total-badge">

<strong>
{{ questions|length }}
</strong>

<span>
асуулт
</span>

</div>

</div>



<form
id="examForm"
method="POST"
action="/submit">


{% for q in questions %}


<div class="question-card">


<div class="question-number">

Асуулт {{ loop.index }}

</div>


<div class="question-text">

{{ q.question }}

</div>


<div class="answers">


<!-- A -->

<label class="answer">

<input
type="radio"
name="q_{{ q.id }}"
value="A">

<span class="letter">
A
</span>

<span>
{{ q.A }}
</span>

</label>


<!-- B -->

<label class="answer">

<input
type="radio"
name="q_{{ q.id }}"
value="B">

<span class="letter">
B
</span>

<span>
{{ q.B }}
</span>

</label>


<!-- C -->

<label class="answer">

<input
type="radio"
name="q_{{ q.id }}"
value="C">

<span class="letter">
C
</span>

<span>
{{ q.C }}
</span>

</label>


<!-- D зөвхөн байвал -->

{% if q.D %}

<label class="answer">

<input
type="radio"
name="q_{{ q.id }}"
value="D">

<span class="letter">
D
</span>

<span>
{{ q.D }}
</span>

</label>

{% endif %}


</div>

</div>


{% endfor %}



<div class="submit-card">

<h4>
Шалгалтаа дуусгах
</h4>

<p>
Бүх хариултаа шалгаад
шалгалтаа дуусгана уу.
</p>

<button
type="submit"
class="btn btn-success btn-lg px-5">

✓ ШАЛГАЛТ ДУУСГАХ

</button>

</div>


</form>


</div>



<script>

let seconds =
{{ exam_minutes }} * 60;


let submitted = false;


const timer =
document.getElementById("timer");


const timerBox =
document.getElementById("timerBox");


function updateTimer() {


let minutes =
Math.floor(seconds / 60);


let secs =
seconds % 60;


if (secs < 10) {

secs = "0" + secs;

}


timer.innerText =
minutes + ":" + secs;



/*
2 минут
*/

if (seconds <= 120) {

timerBox.classList.add(
"warning"
);

}


/*
1 минут
*/

if (seconds <= 60) {

timerBox.classList.add(
"danger"
);

}


/*
ДУУСАХ
*/

if (seconds <= 0) {


if (!submitted) {

submitted = true;


alert(
"Шалгалтын хугацаа дууслаа."
);


document
.getElementById(
"examForm"
)
.submit();

}


return;

}


seconds--;

}


setInterval(
updateTimer,
1000
);


updateTimer();

</script>


</body>

</html>
